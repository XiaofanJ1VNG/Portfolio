<script>

let musicBio='', soundCloudUrl='', musicFile='', cvIntro='', nowItems=[];
let homeData={}, upToData={}, dataReady=false;
async function loadContent(){
  const files=['curation.json','event production.json','design.json','writing.json','music.json','cv.json','home-bio.json','up-to.json'];
  const values=await Promise.all(files.map(async file=>{
